<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0a0f1c"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="main" x1="120" y1="100" x2="400" y2="420" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="50%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <linearGradient id="accent" x1="160" y1="300" x2="360" y2="340" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#22d3ee"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <!-- Background circle -->
  <circle cx="256" cy="256" r="240" fill="url(#bg)" stroke="#1e293b" stroke-width="3"/>
  <!-- Stylized A -->
  <path d="M256 100 L160 400 L200 400 L220 340 L292 340 L312 400 L352 400 Z M240 300 L256 180 L272 300 Z" fill="url(#main)" filter="url(#glow)"/>
  <!-- Bar chart elements inside A -->
  <rect x="226" y="260" width="16" height="40" rx="3" fill="url(#main)" opacity="0.7"/>
  <rect x="248" y="240" width="16" height="60" rx="3" fill="url(#main)" opacity="0.85"/>
  <rect x="270" y="250" width="16" height="50" rx="3" fill="url(#main)" opacity="0.7"/>
  <!-- Orbital ring -->
  <ellipse cx="256" cy="310" rx="130" ry="28" stroke="url(#accent)" stroke-width="5" fill="none" filter="url(#glow)" opacity="0.9"/>
  <!-- Gear tooth accents -->
  <rect x="118" y="298" width="12" height="6" rx="2" fill="#22d3ee" opacity="0.6" transform="rotate(-12 124 301)"/>
  <rect x="382" y="298" width="12" height="6" rx="2" fill="#06b6d4" opacity="0.6" transform="rotate(12 388 301)"/>
</svg>
